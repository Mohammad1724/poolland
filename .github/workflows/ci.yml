name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TEMP (diagnostics): re-emit analyzer diagnostics as annotations.
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze_output.txt 2>&1
          EC=$?
          set -e
          ANALYZE_EXIT="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('ANALYZE_EXIT', '0') or '0')
          out = open('analyze_output.txt', encoding='utf-8', errors='replace').read()
          out = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', out)
          pat = re.compile(r'^\s*(error|warning|info)\s*\u2022\s*(.*?)\s*\u2022\s*([^\u2022:]+):(\d+):(\d+)\s*\u2022\s*(\S+)\s*$', re.M)
          counts = {'error': 0, 'warning': 0, 'info': 0}
          for m in pat.finditer(out):
              level, msg, path, line, col, code = m.groups()
              counts[level] += 1
              msg = msg.replace('%', '%25')
              print(f'::{level} file={path},line={line},col={col}::{msg} [{code}]')
          if ec != 0 or counts['error'] or counts['warning']:
              if not (counts['error'] or counts['warning']):
                  lines = [l.strip() for l in out.splitlines() if l.strip()]
                  head = ' / '.join(lines)[:800]
                  tail = ' / '.join(lines[-12:])
                  print(f'::error file=.github/workflows/ci.yml,line=29::head: {head.replace("%", "%25")}')
                  print(f'::error file=.github/workflows/ci.yml,line=30::tail: {tail.replace("%", "%25")}')
              print('::error::flutter analyze failed')
              sys.exit(1)
          PY
      # TEMP (diagnostics): bounded run; dump the tail + failure blocks.
      - name: Test
        run: |
          set +e
          timeout 900 flutter test --concurrency=1 > test_output.txt 2>&1
          EC=$?
          set -e
          EC="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('EC', '0') or '0')
          out = open('test_output.txt', encoding='utf-8', errors='replace').read()
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in out.splitlines()]
          marks = [i for i, l in enumerate(lines) if 'EXCEPTION CAUGHT' in l or 'TestFailure was thrown' in l]
          if not marks:
              marks = [max(0, len(lines) - 45)]
          emitted = 0
          for m in marks:
              if emitted >= 3:
                  break
              emitted += 1
              for l in lines[max(0, m - 3):m + 55]:
                  msg = l.strip().replace('%', '%25')
                  if msg:
                      print(f'::notice file=test/output.txt,line=1::FAILLOG {msg}')
          tail = [l for l in lines if l.strip()][-25:]
          for l in tail:
              msg = l.strip().replace('%', '%25')
              if msg:
                  print(f'::notice file=test/output.txt,line=2::TAIL {msg}')
          sys.exit(ec)
          PY
