              print('::notice file=test/' + tag.lower() + '.txt,line=' + str(10 + i) + '::' + tag + ' ' + l.replace('%', '%25')[:300])
          PY
      - name: DD entry form + sheet + child tap
        run: |
          set +e
          timeout 240 flutter test test/tmp_diag_test.dart --concurrency=1 --no-pub --reporter expanded --plain-name 'diag D' > dd.txt 2>&1
