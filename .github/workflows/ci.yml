name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (TEMP annotated dump)
        continue-on-error: true
        run: |
          flutter analyze > /tmp/analyze.txt 2>&1
          EC=$?
          python3 - <<'PYEOF'
          lines = open('/tmp/analyze.txt').read().splitlines()
          for i, ln in enumerate(lines[:35]):
              print(f"::error file=.github,line=100{i}::AN {ln[:220]}")
          print(f"::error file=.github,line=900::AN DONE ec=$EC total_lines={len(lines)}")
          PYEOF
      - name: flutter test
        run: flutter test --concurrency=1
