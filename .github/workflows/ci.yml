name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    name: تحلیل و تست
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
