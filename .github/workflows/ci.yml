name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run flutter analyze
        run: |
          if ! flutter analyze > /tmp/analyze.log 2>&1; then
            cat /tmp/analyze.log
            grep -E "^\s*(error|warning|info) " /tmp/analyze.log | head -10 | sed 's/^/::error::/'
            exit 1
          fi
          cat /tmp/analyze.log
      - name: Run flutter test
        run: |
          if ! timeout 240s flutter test --concurrency=1 --reporter expanded > /tmp/test.log 2>&1; then
            tail -40 /tmp/test.log
            grep -E "FAILED|Exception|══╡|Error:|TimeoutException|-\s*\[" /tmp/test.log | tail -15 | sed 's/^/::error::/'
            tail -15 /tmp/test.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -30 /tmp/test.log

  build-apk:
    name: Build APK and check it stays installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter pub get
      # Compiles the APK end-to-end and checks the actual merged manifest:
      # inbox sync uses READ_SMS, and optional arrival alerts use RECEIVE_SMS
      # through the app's explicitly enabled, transaction-filtering receiver.
      - name: Build the APK
        run: |
          # `if ! cmd` is used on purpose: the runner runs the script with
          # `bash -e`, so a plain failing command would abort the step
          # before the error could be captured.
          if ! flutter build apk --debug > /tmp/build.log 2>&1; then
            # The raw job log lives in a blob store, so the important lines
            # are re-emitted as annotations: they show up on the pull
            # request and can be read through the API.
            {
              echo "::error::APK build failed"
              grep -E "^e: " /tmp/build.log | head -8 | sed 's/^/::error::/'
              tail -6 /tmp/build.log | sed 's/^/::error::/'
            }
            tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat /tmp/build.log
      - name: Assert opt-in SMS permissions and receiver
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          echo "Using $AAPT2"
          "$AAPT2" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if ! grep -q 'READ_SMS' /tmp/apk-permissions.txt; then
            echo "::error::The APK is missing READ_SMS, which inbox sync requires."
            exit 1
          fi
          if ! grep -q 'RECEIVE_SMS' /tmp/apk-permissions.txt; then
            echo "::error::The APK is missing RECEIVE_SMS, which opt-in arrival alerts require."
            exit 1
          fi
          if grep -qE 'BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' /tmp/apk-permissions.txt; then
            echo "::error::The APK declares an unused high-risk permission."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/apk-manifest.txt
          if ! grep -q 'SmsReceivedReceiver' /tmp/apk-manifest.txt; then
            echo "::error::The APK must register the opt-in SmsReceivedReceiver."
            exit 1
          fi
          if ! grep -B5 -A8 'SmsReceivedReceiver' /tmp/apk-manifest.txt | grep 'android:enabled.*false' > /dev/null; then
            echo "::error::The SMS receiver must be disabled by default until opt-in."
            exit 1
          fi
          if ! grep -B5 -A8 'SmsReceivedReceiver' /tmp/apk-manifest.txt | grep 'BROADCAST_SMS' > /dev/null; then
            echo "::error::The SMS receiver must restrict broadcasts to the system."
            exit 1
          fi
