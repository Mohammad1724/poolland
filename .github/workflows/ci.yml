name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TEMP (diagnostics): the runner's log file is not readable from
      # outside, so the analyzer's diagnostics are re-emitted as check
      # annotations; the step still fails exactly when `flutter analyze`
      # would have failed.
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze_output.txt 2>&1
          EC=$?
          set -e
          ANALYZE_EXIT="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('ANALYZE_EXIT', '0') or '0')
          out = open('analyze_output.txt', encoding='utf-8', errors='replace').read()
          out = re.sub(r'\x1b\[[0-9;]*m', '', out)
          pat = re.compile(r'^\s*(error|warning|info)\s*\u2022\s*(.*?)\s*\u2022\s*([^\u2022:]+):(\d+):(\d+)\s*\u2022\s*(\S+)\s*$', re.M)
          counts = {'error': 0, 'warning': 0, 'info': 0}
          for m in pat.finditer(out):
              level, msg, path, line, col, code = m.groups()
              counts[level] += 1
              msg = msg.replace('%', '%25')
              print(f'::{level} file={path},line={line},col={col}::{msg} [{code}]')
          print(f'flutter analyze exit={ec} -> {counts["error"]} errors, {counts["warning"]} warnings, {counts["info"]} infos')
          if ec != 0 or counts['error'] or counts['warning']:
              if not (counts['error'] or counts['warning']):
                  lines = [l.strip() for l in out.splitlines() if l.strip()]
                  head = ' / '.join(lines)[:800]
                  tail = ' / '.join(lines[-12:])
                  print(f'::error file=.github/workflows/ci.yml,line=29::head: {head.replace("%", "%25")}')
                  print(f'::error file=.github/workflows/ci.yml,line=30::tail: {tail.replace("%", "%25")}')
                  raws = [l for l in lines if re.search(r'(error|warning|info)\s*\u2022', l)][:3]
                  for l in raws:
                      print(f'::error file=.github/workflows/ci.yml,line=31::RAWLINE {l!r}'.replace('%', '%25'))
              print('::error::flutter analyze failed')
              sys.exit(1)
          PY
      # TEMP (diagnostics): the runner's log file is not readable from
      # outside, so the test output is captured to a file and the DIAGRAW
      # lines the tests emit are re-surfaced as check annotations (in-test
      # workflow commands are unreliable). The step still fails exactly
      # when `flutter test` would have failed.
      - name: Test
        run: |
          set +e
          flutter test --concurrency=1 > test_output.txt 2>&1
          EC=$?
          set -e
          grep -aE '^(DIAGRAW |::error::FAILED_TEST)' test_output.txt 2>/dev/null | head -10 | while IFS= read -r line; do
            case "$line" in
              DIAGRAW*)
                msg="${line#DIAGRAW }"
                msg="${msg//\%/%25}"
                printf '::notice file=test/diag.txt,line=1::%s\n' "$msg"
                ;;
              *)
                printf '%s\n' "$line"
                ;;
            esac
          done || true
          if [ "$EC" -ne 0 ]; then
            EC="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('EC', '0') or '0')
          out = open('test_output.txt', encoding='utf-8', errors='replace').read()
          lines = [re.sub(r'\x1b\[[0-9;]*m', '', l).rstrip() for l in out.splitlines()]
          marks = [i for i, l in enumerate(lines) if '[E]' in l or '\u274c' in l]
          if not marks:
              marks = [max(0, len(lines) - 45)]
          emitted = 0
          for m in marks:
              if emitted >= 3:
                  break
              emitted += 1
              for l in lines[max(0, m - 25):m + 40]:
                  msg = l.strip().replace('%', '%25')
                  if msg:
                      print(f'::notice file=test/output.txt,line=1::FAILLOG {msg}')
          sys.exit(ec)
          PY
          fi
