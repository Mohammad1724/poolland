name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    # TEMP (diagnostic round 2): per-test bounded probes with exit codes and
    # output tails. Reverted to the original workflow afterwards.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: DL2 scroll to add button
        run: |
          set +e
          timeout 240 flutter test test/tmp_diag_test.dart --concurrency=1 --no-pub --reporter expanded --plain-name 'DL2 reach add' > dl2.txt 2>&1
          EC=$?
          set -e
          EC="$EC" TAG="DL2" python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          ec = int(os.environ.get('EC', '0'))
          print('::notice file=test/' + tag.lower() + '.txt,line=1::' + tag + ' EC=' + str(ec))
          try:
              raw = open(tag.lower() + '.txt', encoding='utf-8', errors='replace').read()
          except Exception as e:
              print('::notice file=test/' + tag.lower() + '.txt,line=2::' + tag + ' NOFILE ' + str(e))
              raise SystemExit(0)
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in raw.splitlines()]
          lines = [l for l in lines if l.strip()][-70:]
          for i, l in enumerate(lines):
              print('::notice file=test/' + tag.lower() + '.txt,line=' + str(10 + i) + '::' + tag + ' ' + l.replace('%', '%25')[:400])
          PY
      - name: DN3 delete cancel + runAsync
        run: |
          set +e
          timeout 240 flutter test test/tmp_diag_test.dart --concurrency=1 --no-pub --reporter expanded --plain-name 'DN3 delete' > dn3.txt 2>&1
          EC=$?
          set -e
          EC="$EC" TAG="DN3" python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          ec = int(os.environ.get('EC', '0'))
          print('::notice file=test/' + tag.lower() + '.txt,line=1::' + tag + ' EC=' + str(ec))
          try:
              raw = open(tag.lower() + '.txt', encoding='utf-8', errors='replace').read()
          except Exception as e:
              print('::notice file=test/' + tag.lower() + '.txt,line=2::' + tag + ' NOFILE ' + str(e))
              raise SystemExit(0)
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in raw.splitlines()]
          lines = [l for l in lines if l.strip()][-70:]
          for i, l in enumerate(lines):
              print('::notice file=test/' + tag.lower() + '.txt,line=' + str(10 + i) + '::' + tag + ' ' + l.replace('%', '%25')[:400])
          PY
      - name: DN4 create save + runAsync drain
        run: |
          set +e
          timeout 240 flutter test test/tmp_diag_test.dart --concurrency=1 --no-pub --reporter expanded --plain-name 'DN4 create' > dn4.txt 2>&1
          EC=$?
          set -e
          EC="$EC" TAG="DN4" python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          ec = int(os.environ.get('EC', '0'))
          print('::notice file=test/' + tag.lower() + '.txt,line=1::' + tag + ' EC=' + str(ec))
          try:
              raw = open(tag.lower() + '.txt', encoding='utf-8', errors='replace').read()
          except Exception as e:
              print('::notice file=test/' + tag.lower() + '.txt,line=2::' + tag + ' NOFILE ' + str(e))
              raise SystemExit(0)
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in raw.splitlines()]
          lines = [l for l in lines if l.strip()][-70:]
          for i, l in enumerate(lines):
              print('::notice file=test/' + tag.lower() + '.txt,line=' + str(10 + i) + '::' + tag + ' ' + l.replace('%', '%25')[:400])
          PY
