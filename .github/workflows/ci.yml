name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: "Test (temporary: publish failure blocks as annotations)"
        run: |
          set +e
          flutter test --concurrency=1 > testout.txt 2>&1
          code=$?
          awk '/EXCEPTION CAUGHT|Expected:|The following assertion failed|Bad state|MissingPlugin|\[E\]/{buf=$0; for(i=0;i<12 && getline line;i++) buf=buf "%0A" line; print "::error file=test/fail::" buf; print ""}' testout.txt | head -120
          echo "::error file=test/tail::TAIL %0A$(tail -35 testout.txt | sed 's/$/%0A/' | tr -d '\n')" 
          exit $code
      - run: flutter test --concurrency=1
