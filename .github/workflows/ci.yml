name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TEMP (diagnostics): the runner's log file is not readable from
      # outside, so the analyzer's diagnostics are re-emitted as check
      # annotations; the step still fails exactly when `flutter analyze`
      # would have failed.
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze_output.txt 2>&1
          EC=$?
          set -e
          ANALYZE_EXIT="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('ANALYZE_EXIT', '0') or '0')
          out = open('analyze_output.txt', encoding='utf-8', errors='replace').read()
          pat = re.compile(r'^\s*(error|warning|info)\s*\u2022\s*(.*?)\s*\u2022\s*([^\u2022:]+):(\d+):(\d+)\s*\u2022\s*(\S+)\s*$', re.M)
          counts = {'error': 0, 'warning': 0, 'info': 0}
          for m in pat.finditer(out):
              level, msg, path, line, col, code = m.groups()
              counts[level] += 1
              msg = msg.replace('%', '%25')
              print(f'::{level} file={path},line={line},col={col}::{msg} [{code}]')
          print(f'flutter analyze exit={ec} -> {counts["error"]} errors, {counts["warning"]} warnings, {counts["info"]} infos')
          if ec != 0 or counts['error'] or counts['warning']:
              print('::error::flutter analyze failed')
              sys.exit(1)
          PY
      # TEMP (diagnostics): the runner's log file is not readable from
      # outside, so the test output is captured to a file and the DIAGRAW
      # lines the tests emit are re-surfaced as check annotations (in-test
      # workflow commands are unreliable). The step still fails exactly
      # when `flutter test` would have failed.
      - name: Test
        run: |
          set +e
          flutter test --concurrency=1 > test_output.txt 2>&1
          EC=$?
          set -e
          grep -a '^DIAGRAW ' test_output.txt 2>/dev/null | head -20 | while IFS= read -r line; do
            msg="${line#DIAGRAW }"
            msg="${msg//\%/%25}"
            printf '::notice file=test/diag.txt,line=1::%s\n' "$msg"
          done || true
          if [ "$EC" -ne 0 ]; then
            exit 1
          fi
