name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (annotated)
        run: |
          set +e
          dart analyze --format=machine lib test > analyze.txt
          code=$?
          while IFS='|' read -r sev typ cod file line col len msg; do
            echo "::error file=${file},line=${line},col=${col}::${sev} ${cod}: ${msg}"
          done < analyze.txt
          cat analyze.txt
          exit $code
      - name: flutter test
        if: ${{ !cancelled() }}
        run: flutter test --concurrency=1
