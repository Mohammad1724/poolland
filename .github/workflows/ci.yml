          except Exception as e:
              print('::notice file=test/' + tag.lower() + '.txt,line=2::' + tag + ' NOFILE ' + str(e))
              raise SystemExit(0)
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in raw.splitlines()]
          lines = [l for l in lines if l.strip()][-60:]
          for i, l in enumerate(lines):
              print('::notice file=test/' + tag.lower() + '.txt,line=' + str(10 + i) + '::' + tag + ' ' + l.replace('%', '%25')[:300])
          PY
      - name: DC expense tab + add button
        run: |
          set +e
          timeout 240 flutter test test/tmp_diag_test.dart --concurrency=1 --no-pub --reporter expanded --plain-name 'diag C' > dc.txt 2>&1
