name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze to file
        continue-on-error: true
        run: |
          flutter analyze > test/tmp_analyze_out.txt 2>&1
          echo "AN_EC=$?" >> test/tmp_analyze_out.txt
      - name: run diagnostic test
        continue-on-error: true
        run: flutter test test/tmp_create_diag_test.dart --concurrency=1
