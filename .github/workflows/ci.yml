name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1

  build-safe-apk:
    name: Build Play Protect-safe APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter pub get
      # Compiles the safe flavor end-to-end and proves the Play Protect block
      # cannot come back: the merged manifest of the actual APK must declare
      # no SMS permission and no SmsReceiver. (Play Protect blocks
      # internet-sideloaded APKs that declare READ_SMS, RECEIVE_SMS, a
      # notification listener, or an accessibility service.)
      - name: Build the safe flavor
        run: flutter build apk --debug --flavor safe
      - name: Assert the safe APK declares no sensitive permission
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-safe-debug.apk"
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          echo "Using $AAPT2"
          "$AAPT2" dump permissions "$APK" | tee /tmp/safe-permissions.txt
          if grep -qE 'READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' /tmp/safe-permissions.txt; then
            echo "::error::The safe APK declares a Play Protect-blocked permission."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/safe-manifest.txt
          if grep -q 'SmsReceiver' /tmp/safe-manifest.txt; then
            echo "::error::The safe APK still registers SmsReceiver."
            exit 1
          fi
