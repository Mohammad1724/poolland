name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    # TEMP (diagnostic round 2): per-test bounded probes with exit codes and
    # output tails. Reverted to the original workflow afterwards.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: P1 subcategory file (all)
        run: |
          set +e
          timeout 600 flutter test test/subcategory_test.dart --concurrency=1 --no-pub > p1.txt 2>&1
          EC=$?
          set -e
          EC="$EC" TAG="P1" python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          ec = int(os.environ.get('EC', '0'))
          print('::notice file=test/%s.txt,line=1::%s EC=%d' % (tag, tag, ec))
          try:
              raw = open(tag + '.txt', encoding='utf-8', errors='replace').read()
          except Exception as e:
              print('::notice file=test/%s.txt,line=2::%s NOFILE %s' % (tag, tag, e))
              raise SystemExit(0)
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in raw.splitlines()]
          lines = [l for l in lines if l.strip()][-45:]
          for i, l in enumerate(lines):
              print('::notice file=test/%s.txt,line=%d::%s %s' % (tag, 10 + i, tag, l.replace('%', '%25')[:300]))
          PY

