name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: "Analyze (temporary: publish issues as annotations)"
        run: |
          set +e
          flutter analyze > an.txt 2>&1
          awk -F' • ' '/ • /{split($3,a,":"); print "::error file=" a[1] ",line=" a[2] ",col=" a[3] "::" $4 ": " $2}' an.txt | head -60
          exit 0
      - run: flutter analyze
      - name: "Test (temporary: phase3 dump)"
        run: |
          set +e
          flutter test --concurrency=1 --reporter expanded test/phase3_gestures_test.dart > testout.txt 2>&1
          awk '/EXCEPTION CAUGHT BY|Test failed/{n++; if(n<=2){show=1; c=0}} show&&c<45{print $0; c++; if(c>=45)show=0}' testout.txt | cut -c1-160 | awk '{print "::error file=test/ctx,line=" NR "::" $0}'
          exit 0
      - run: flutter test --concurrency=1
