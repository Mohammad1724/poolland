name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # TEMP: isolate the new subcategory tests.
      - name: Test subcategory only
        run: |
          set +e
          timeout 600 flutter test test/subcategory_test.dart --concurrency=1 > test_output.txt 2>&1
          EC=$?
          set -e
          EC="$EC" python3 - <<'PY'
          import os, re, sys
          ec = int(os.environ.get('EC', '0') or '0')
          out = open('test_output.txt', encoding='utf-8', errors='replace').read()
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip() for l in out.splitlines()]
          marks = [i for i, l in enumerate(lines) if 'EXCEPTION CAUGHT' in l or 'TestFailure was thrown' in l]
          if not marks:
              marks = [max(0, len(lines) - 45)]
          emitted = 0
          for m in marks:
              if emitted >= 3:
                  break
              emitted += 1
              for l in lines[max(0, m - 3):m + 55]:
                  msg = l.strip().replace('%', '%25')
                  if msg:
                      print(f'::notice file=test/output.txt,line=1::FAILLOG {msg}')
          tail = [l for l in lines if l.strip()][-25:]
          for l in tail:
              msg = l.strip().replace('%', '%25')
              if msg:
                  print(f'::notice file=test/output.txt,line=2::TAIL {msg}')
          sys.exit(ec)
          PY
