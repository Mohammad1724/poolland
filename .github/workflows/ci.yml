name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    # TEMP (diagnostic): hard cap so we get the final progress dump instead of
    # another 6-hour kill. Will be reverted to the original workflow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # TEMP (diagnostic): three bounded probes with live progress annotations.
      # A = old fast file (control), B = new subcategory file (suspect),
      # C = full suite. Each ends with a dump of its last output lines.
      - name: Probe A - old file (ledger_test)
        run: |
          ( timeout 420 flutter test test/ledger_test.dart --concurrency=1 --no-pub > probeA.txt 2>&1; echo "EXITCODE=$?" >> probeA.txt ) &
          FLPID=$!
          for i in $(seq 1 28); do
            sleep 15
            LAST=$(tail -c 2000 probeA.txt 2>/dev/null | tr -d '\000-\037' | grep -v '^[[:space:]]*$' | tail -n 1 | cut -c1-200)
            if [ -n "$LAST" ]; then
              LAST="${LAST//\%/%25}"
              echo "::notice file=test/probeA.txt,line=$i::PA $LAST"
            fi
            grep -q '^EXITCODE=' probeA.txt 2>/dev/null && break
          done
          wait $FLPID
          python3 - <<'PY'
          import re
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip()
                   for l in open('probeA.txt', encoding='utf-8', errors='replace')]
          lines = [l for l in lines if l.strip()][-40:]
          for l in lines:
              print('::notice file=test/probeA.txt,line=99::PAT ' + l.replace('%', '%25')[:300])
          PY

      - name: Probe B - new file (subcategory_test)
        run: |
          ( timeout 600 flutter test test/subcategory_test.dart --concurrency=1 --no-pub > probeB.txt 2>&1; echo "EXITCODE=$?" >> probeB.txt ) &
          FLPID=$!
          for i in $(seq 1 40); do
            sleep 15
            LAST=$(tail -c 2000 probeB.txt 2>/dev/null | tr -d '\000-\037' | grep -v '^[[:space:]]*$' | tail -n 1 | cut -c1-200)
            if [ -n "$LAST" ]; then
              LAST="${LAST//\%/%25}"
              echo "::notice file=test/probeB.txt,line=$i::PB $LAST"
            fi
            grep -q '^EXITCODE=' probeB.txt 2>/dev/null && break
          done
          wait $FLPID
          python3 - <<'PY'
          import re
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip()
                   for l in open('probeB.txt', encoding='utf-8', errors='replace')]
          lines = [l for l in lines if l.strip()][-40:]
          for l in lines:
              print('::notice file=test/probeB.txt,line=99::PBT ' + l.replace('%', '%25')[:300])
          PY

      - name: Probe C - full suite
        run: |
          ( timeout 1500 flutter test --concurrency=1 --no-pub > probeC.txt 2>&1; echo "EXITCODE=$?" >> probeC.txt ) &
          FLPID=$!
          for i in $(seq 1 100); do
            sleep 15
            LAST=$(tail -c 2000 probeC.txt 2>/dev/null | tr -d '\000-\037' | grep -v '^[[:space:]]*$' | tail -n 1 | cut -c1-200)
            if [ -n "$LAST" ]; then
              LAST="${LAST//\%/%25}"
              echo "::notice file=test/probeC.txt,line=$i::PC $LAST"
            fi
            grep -q '^EXITCODE=' probeC.txt 2>/dev/null && break
          done
          wait $FLPID
          python3 - <<'PY'
          import re
          lines = [re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', l).rstrip()
                   for l in open('probeC.txt', encoding='utf-8', errors='replace')]
          lines = [l for l in lines if l.strip()][-60:]
          for l in lines:
              print('::notice file=test/probeC.txt,line=99::PCT ' + l.replace('%', '%25')[:300])
          PY
