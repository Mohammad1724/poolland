name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (new pushes to the same branch/PR) are cancelled instead of
# piling up in the Actions tab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1

  build-apk:
    name: Build APK and check it stays installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter pub get
      # Compiles the release APK end-to-end and proves the Play Protect
      # block cannot come back: the merged manifest of the actual APK must
      # declare no sensitive permission and register no SMS receiver.
      # (Play Protect blocks internet-sideloaded APKs that declare
      # READ_SMS, RECEIVE_SMS, a notification listener, or an accessibility
      # service — by permission, not by signature.)
      - name: Build the APK
        run: flutter build apk --debug
      - name: Assert the APK declares no sensitive permission
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          echo "Using $AAPT2"
          "$AAPT2" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if grep -qE 'READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' /tmp/apk-permissions.txt; then
            echo "::error::The APK declares a Play Protect-blocked permission."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/apk-manifest.txt
          if grep -q 'SmsReceiver' /tmp/apk-manifest.txt; then
            echo "::error::The APK still registers SmsReceiver."
            exit 1
          fi
