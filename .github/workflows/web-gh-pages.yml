name: GitHub Pages site (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web:
    name: Build and publish website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release --base-href=/poolland/ --no-web-resources-cdn

      - name: Add .nojekyll marker
        run: |
          touch build/web/.nojekyll
          echo "poolland" > build/web/CNAME.txt || true

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Automatically publish site from commit ${{ github.sha }}'
