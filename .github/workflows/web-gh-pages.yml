name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-web:
    name: Build and publish website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter pub get

      # --no-web-resources-cdn keeps the build free of Google's gstatic CDN,
      # so the web app also loads on networks where Google is unreachable.
      - name: Build web app
        run: flutter build web --release --base-href=/poolland/ --no-web-resources-cdn

      - name: Add .nojekyll marker
        run: touch build/web/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Automatically publish site from commit ${{ github.sha }}'
