name: Debug analyze

on:
  push:
    branches: [arena/1d27b4fa-poolland]

jobs:
  analyze:
    name: Analyze with annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          code=$?
          # Re-publish the findings as check-run annotations, because the raw
          # job log is not reachable from the review sandbox. Try the "level •
          # message • path" shape first, then dart's "level - path - message"
          # shape, and fall back to the tail of the output.
          grep -nE "^[[:space:]]*(error|warning|info)([[:space:]]|•|-)" /tmp/analyze.txt > /tmp/findings.txt
          if [ ! -s /tmp/findings.txt ]; then
            tail -n 40 /tmp/analyze.txt > /tmp/findings.txt
          fi
          n=0
          while IFS= read -r line; do
            [ "$n" -ge 45 ] && break
            printf '::error title=analyze::%s\n' "$line"
            n=$((n + 1))
          done < /tmp/findings.txt
          printf '::error title=summary::exit=%s annotated=%s total_lines=%s\n' "$code" "$n" "$(wc -l < /tmp/analyze.txt)"
          exit "$code"
      - name: Test
        if: always()
        run: |
          set +e
          flutter test --concurrency=1 > /tmp/test.txt 2>&1
          code=$?
          grep -nE "^([0-9]{2}:[0-9]{2} )?.*(\[E\]|Exception|Error:|FAILED|Expected:|Actual:|failed|passed)" /tmp/test.txt > /tmp/tfindings.txt
          if [ ! -s /tmp/tfindings.txt ]; then
            tail -n 40 /tmp/test.txt > /tmp/tfindings.txt
          fi
          n=0
          while IFS= read -r line; do
            [ "$n" -ge 45 ] && break
            printf '::error title=test::%s\n' "$line"
            n=$((n + 1))
          done < /tmp/tfindings.txt
          printf '::error title=test-summary::exit=%s annotated=%s total_lines=%s\n' "$code" "$n" "$(wc -l < /tmp/test.txt)"
          exit "$code"
