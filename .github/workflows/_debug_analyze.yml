name: Debug analyze
on:
  push:
    branches: [arena/1d27b4fa-poolland]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: analyze
        run: |
          enc() { awk '{gsub(/%/,"%25"); printf "%s%s", (NR>1?"%0A":""), $0}' | cut -c1-3000; }
          flutter analyze --no-pub > /tmp/a.txt 2>&1 || true
          printf '::error title=ANALYZE::%s\n' "$(grep -E "error|warning" /tmp/a.txt | head -25 | enc)"
          printf '::notice title=ANALYZE_TAIL::%s\n' "$(tail -3 /tmp/a.txt | enc)"
      - name: test
        if: always()
        run: |
          enc() { awk '{gsub(/%/,"%25"); printf "%s%s", (NR>1?"%0A":""), $0}' | cut -c1-3000; }
          flutter test --concurrency=1 --reporter expanded > /tmp/t.txt 2>&1 || true
          printf '::error title=FAILED::%s\n' "$(grep "FAILED_TEST" /tmp/t.txt | head -8 | enc)"
          printf '::error title=BLOCK1::%s\n' "$(awk '/\[E\]/{c++} c>=1 && c<2' /tmp/t.txt | head -30 | enc)"
          printf '::error title=LOAD::%s\n' "$(grep -E "Failed to load|Compilation failed|Some tests failed|All tests passed" /tmp/t.txt | head -12 | enc)"
