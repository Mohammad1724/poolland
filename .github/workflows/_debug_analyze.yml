name: Debug analyze
on:
  push:
    branches: [arena/1d27b4fa-poolland]
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: analyze
        run: |
          enc() { awk '{gsub(/%/,"%25"); printf "%s%s", (NR>1?"%0A":""), $0}' | cut -c1-2500; }
          flutter analyze --no-pub > /tmp/a.txt 2>&1 || true
          printf '::error title=ANALYZE::%s\n' "$(grep -E "error|warning" /tmp/a.txt | head -20 | enc)"
      - name: test
        if: always()
        run: |
          enc() { awk '{gsub(/%/,"%25"); printf "%s%s", (NR>1?"%0A":""), $0}' | cut -c1-2500; }
          flutter test --concurrency=1 --reporter expanded > /tmp/t.txt 2>&1 || true
          printf '::error title=NAMES::%s\n' "$(grep -m 6 "\[E\]" /tmp/t.txt | enc)"
          printf '::error title=EXC::%s\n' "$(grep -A 30 -m 1 "EXCEPTION CAUGHT" /tmp/t.txt | enc)"
          printf '::error title=SIG::%s\n' "$(grep -m 8 -E "pumpAndSettle timed out|A Timer is still pending|Failed to load|Some tests failed|All tests passed|Test timed out|FAILED_TEST" /tmp/t.txt | enc)"
