name: ساخت APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ساخت APK و انتشار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: آماده‌سازی
        run: flutter pub get

      - name: تست‌ها
        run: flutter test --concurrency=1

      - name: ساخت APK
        run: flutter build apk --release --split-per-abi

      - name: ساخت APK همه‌کاره
        run: flutter build apk --release

      - name: نام‌گذاری فایل‌ها
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/poolland-${VERSION}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-${abi}-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "artifacts/poolland-${VERSION}-${abi}.apk"
            fi
          done
          ls -la artifacts

      - name: آپلود به‌عنوان آرتیفکت
        uses: actions/upload-artifact@v4
        with:
          name: poolland-apk
          path: artifacts/*.apk

      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
