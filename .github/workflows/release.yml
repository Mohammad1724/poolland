name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1

      # Release signing is optional but recommended.
      #
      # If the ANDROID_KEYSTORE_* secrets exist (Settings → Secrets and
      # variables → Actions), the APKs are signed with the real release key —
      # see the "Signing release builds" section in README.md for how to
      # create one. Without the secrets, Gradle falls back to the debug key
      # and the release notes say so explicitly: a debug-signed APK installs
      # fine, but users cannot upgrade over it in place.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poolland-release.jks"
            echo "POOLLAND_KEYSTORE_PATH=$RUNNER_TEMP/poolland-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug key (add the ANDROID_KEYSTORE_* secrets to ship a real release key)" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — signing with the debug key."
          fi

      # One build, one app id, one version.
      #
      # The app declares no SMS permission, so Google Play Protect installs
      # it from a browser, a messenger, or a file manager without a block —
      # there is no second "full" flavor to choose from any more, and no
      # way for the block to come back.
      - name: Build APKs
        env:
          POOLLAND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POOLLAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POOLLAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Assert the release APK declares no sensitive permission
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump permissions "$APK" | tee /tmp/release-permissions.txt
          if grep -qE 'READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' /tmp/release-permissions.txt; then
            echo "::error::The release APK declares a Play Protect-blocked permission."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/release-manifest.txt
          if grep -q 'SmsReceiver' /tmp/release-manifest.txt; then
            echo "::error::The release APK still registers SmsReceiver."
            exit 1
          fi

      - name: Collect and name artifacts
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "artifacts/poolland-${VERSION}-universal.apk"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            APK="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$APK" ]; then
              cp "$APK" "artifacts/poolland-${VERSION}-${abi}.apk"
            fi
          done
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          ls -la artifacts
          {
            echo "## Release build"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Signing: ${SIGNING}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poolland-apk
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          append_body: true
          body: |
            ### Signing

            These APKs were signed with the **${{ env.SIGNING }}**.

            | File | SMS access | Play Protect | Best for |
            |---|---|---|---|
            | `poolland-*-arm64-v8a.apk` | no | installs normally | **recommended** — ~95% of modern phones |
            | `poolland-*-armeabi-v7a.apk` | no | installs normally | older 32-bit phones |
            | `poolland-*-universal.apk` | no | installs normally | every phone (larger) |

            The app declares **no SMS permission**, so Google Play Protect installs
            it from a browser, a messenger, or a file manager without a block.
            A bank message is recorded by pasting its text on the review page.

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
