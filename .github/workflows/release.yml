name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1

      # Release signing is optional but recommended.
      #
      # If the ANDROID_KEYSTORE_* secrets exist (Settings → Secrets and
      # variables → Actions), the APKs are signed with the real release key —
      # see the "Signing release builds" section in README.md for how to
      # create one. Without the secrets, Gradle falls back to the debug key
      # and the release notes say so explicitly: a debug-signed APK installs
      # fine, but users cannot upgrade over it in place.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poolland-release.jks"
            echo "POOLLAND_KEYSTORE_PATH=$RUNNER_TEMP/poolland-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug key (add the ANDROID_KEYSTORE_* secrets to ship a real release key)" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — signing with the debug key."
          fi

      # One build, one app id, one version. READ_SMS supports user-triggered
      # inbox sync; RECEIVE_SMS is used only after the user enables bank-SMS
      # arrival alerts. Sideloading may trigger a Play Protect warning/block.
      - name: Build APKs
        env:
          POOLLAND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POOLLAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POOLLAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Assert release SMS permissions and receiver
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump permissions "$APK" | tee /tmp/release-permissions.txt
          if ! grep -q 'READ_SMS' /tmp/release-permissions.txt; then
            echo "::error::The release APK is missing READ_SMS, which inbox sync requires."
            exit 1
          fi
          if ! grep -q 'RECEIVE_SMS' /tmp/release-permissions.txt; then
            echo "::error::The release APK is missing RECEIVE_SMS, which opt-in arrival alerts require."
            exit 1
          fi
          if grep -qE 'BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' /tmp/release-permissions.txt; then
            echo "::error::The release APK declares an unused high-risk permission."
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/release-manifest.txt
          if ! grep -q 'SmsReceivedReceiver' /tmp/release-manifest.txt; then
            echo "::error::The release APK must register the opt-in SmsReceivedReceiver."
            exit 1
          fi
          if ! grep -B5 -A8 'SmsReceivedReceiver' /tmp/release-manifest.txt | grep 'android:enabled.*false' > /dev/null; then
            echo "::error::The release SMS receiver must be disabled by default until opt-in."
            exit 1
          fi
          if ! grep -B5 -A8 'SmsReceivedReceiver' /tmp/release-manifest.txt | grep 'BROADCAST_SMS' > /dev/null; then
            echo "::error::The release SMS receiver must restrict broadcasts to the system."
            exit 1
          fi

      - name: Collect and name artifacts
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "artifacts/poolland-${VERSION}-universal.apk"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            APK="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$APK" ]; then
              cp "$APK" "artifacts/poolland-${VERSION}-${abi}.apk"
            fi
          done
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          ls -la artifacts
          {
            echo "## Release build"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Signing: ${SIGNING}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poolland-apk
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          append_body: true
          body: |
            ### Signing

            These APKs were signed with the **${{ env.SIGNING }}**.

            | File | SMS access | Play Protect | Best for |
            |---|---|---|---|
            | `poolland-*-arm64-v8a.apk` | `READ_SMS` for sync; optional `RECEIVE_SMS` alerts | may warn or block sideloading | **recommended** — ~95% of modern phones |
            | `poolland-*-armeabi-v7a.apk` | `READ_SMS` for sync; optional `RECEIVE_SMS` alerts | may warn or block sideloading | older 32-bit phones |
            | `poolland-*-universal.apk` | `READ_SMS` for sync; optional `RECEIVE_SMS` alerts | may warn or block sideloading | every phone (larger) |

            Poolland uses `READ_SMS` for on-device inbox sync. New-message alerts
            are optional and require a separate `RECEIVE_SMS` opt-in in the SMS
            review page; only enabled bank-rule transaction candidates produce
            private notifications. Tapping opens review, and every transaction
            still requires approval. Sideloaded APKs requesting SMS permissions
            may trigger Google Play Protect; Google Play restricts SMS permissions.

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
