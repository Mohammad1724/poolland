name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --concurrency=1

      # Release signing is optional but recommended.
      #
      # If the ANDROID_KEYSTORE_* secrets exist (Settings → Secrets and
      # variables → Actions), the APKs are signed with the real release key —
      # see the "Signing release builds" section in README.md for how to
      # create one. Without the secrets, Gradle falls back to the debug key
      # and the release notes say so explicitly: a debug-signed APK installs
      # fine, but users cannot upgrade over it in place.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poolland-release.jks"
            echo "POOLLAND_KEYSTORE_PATH=$RUNNER_TEMP/poolland-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug key (add the ANDROID_KEYSTORE_* secrets to ship a real release key)" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — signing with the debug key."
          fi

      - name: Build split APKs
        env:
          POOLLAND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POOLLAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POOLLAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        env:
          POOLLAND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POOLLAND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POOLLAND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Collect and name artifacts
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/poolland-${VERSION}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-${abi}-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "artifacts/poolland-${VERSION}-${abi}.apk"
            fi
          done
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          ls -la artifacts
          {
            echo "## Release build"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Signing: ${SIGNING}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poolland-apk
          path: artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          append_body: true
          body: |
            ### Signing

            These APKs were signed with the **${{ env.SIGNING }}**.

            | File | Best for |
            |---|---|
            | `poolland-*-arm64-v8a.apk` | ~95% of modern phones (smallest, recommended) |
            | `poolland-*-armeabi-v7a.apk` | older 32-bit phones |
            | `poolland-*-universal.apk` | every phone (larger) |

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
