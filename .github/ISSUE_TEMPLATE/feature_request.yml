name: پیشنهاد قابلیت
description: ایده‌ای داری که پول‌لند را بهتر می‌کند؟
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: ایده‌ی تو چیست؟
      description: مشکل یا نیازی که داری را توضیح بده
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: چرا این قابلیت مهم است؟
      description: مثلاً «هر روز درگیر این هستم که...»
    validations:
      required: false
