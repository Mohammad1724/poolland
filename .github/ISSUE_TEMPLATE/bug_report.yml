name: Bug report
description: Something is not working as expected? Let us know so we can fix it.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. v1.0.0
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Samsung A54 / Android 14
