name: گزارش باگ
description: چیزی درست کار نمی‌کند؟ بگو تا درستش کنیم
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: چه اتفاقی افتاد؟
      description: توضیح بده چه کاری کردی و چه چیزی خراب شد
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: انتظار داشتی چه اتفاقی بیفتد؟
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: نسخه‌ی برنامه
      placeholder: مثلاً v1.0.0
  - type: input
    id: device
    attributes:
      label: دستگاه و نسخه‌ی اندروید
      placeholder: مثلاً Samsung A54 / Android 14
