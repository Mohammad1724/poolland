name: poolland
description: "Poolland — a simple offline ledger for VPN sellers: customers, subscriptions, receivables, payables, income, and expenses across multiple currencies."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Local storage (Hive Community Edition)
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

  # Files, sharing, and file selection
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0

  # Charts
  fl_chart: ^1.2.0

  # Jalali calendar and number formatting
  shamsi_date: ^1.1.1
  intl: ^0.20.3

  # Daily reminder notifications and time zones
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # App lock: fingerprint / face unlock on top of the PIN.
  # local_auth_android is declared explicitly because the Persian strings for
  # the system prompt come from its AndroidAuthMessages.
  local_auth: ^3.0.2
  local_auth_android: ^2.0.0

  # Utilities
  uuid: ^4.6.0
  crypto: ^3.0.6
  pdf: ^3.13.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
