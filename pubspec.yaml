name: poolland
description: "پول‌لند — دفتر حسابداری ساده و آفلاین برای فروشندگان VPN: مشتری‌ها، اشتراک‌ها، بدهکار/بستانکار، درآمد و هزینه (چند ارزی)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # مدیریت وضعیت
  provider: ^6.1.5

  # ذخیره‌سازی محلی (Hive Community Edition)
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

  # فایل، اشتراک‌گذاری و انتخاب فایل
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.1.0

  # نمودار
  fl_chart: ^1.2.0

  # تاریخ شمسی و قالب‌بندی اعداد
  shamsi_date: ^1.1.1
  intl: ^0.20.3

  # ابزارها
  uuid: ^4.6.0
  crypto: ^3.0.6
  pdf: ^3.13.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
